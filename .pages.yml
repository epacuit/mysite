settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "Add {filename} with Pages CMS"
      update: "Update {filename} with Pages CMS"
      delete: "Delete {filename} with Pages CMS"
      rename: "Rename {oldFilename} to {newFilename} with Pages CMS"

media:
  - name: publication_pdfs
    label: Publication PDFs
    input: data/pubs
    output: /api/files/pubs
    extensions: [pdf]
    rename: safe

  - name: course_syllabi
    label: Course syllabi
    input: data/courses
    output: /api/files/courses
    extensions: [pdf]
    rename: safe

content:
  - name: publications
    label: Publications
    description: Create and update publication metadata and PDF files.
    type: collection
    path: data/pubs
    subfolders: false
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    operations:
      create: true
      rename: false
      delete: false
    view:
      layout: list
      primary: title
      fields: [title, year, type, authors, front_page]
      sort: [front_page, year, type, title, authors]
      search: [year, title, authors, citation, journal, bookname, tags]
      default:
        search: ""
        sort: year
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: authors
        label: Displayed authors
        type: string
        required: true
        description: Full author line exactly as it should appear on the website.

      - name: coauthor
        label: Coauthors
        type: string
        list: true
        description: Individual coauthor names used as structured metadata.

      - name: year
        label: Year
        type: number
        required: true
        options:
          min: 1900
          max: 2100

      - name: type
        label: Publication type
        type: select
        required: true
        options:
          values:
            - name: book
              label: Book
            - name: manuscript
              label: Working paper
            - name: journal
              label: Journal article
            - name: encyclopedia
              label: Encyclopedia entry
            - name: proceedings
              label: Conference proceedings
            - name: chapter
              label: Book chapter

      - name: citation
        label: Citation text
        type: text
        required: true
        description: Publication venue and other text displayed between the authors and year.

      - name: journal
        label: Journal
        type: string

      - name: volume
        label: Volume
        type: number

      - name: number
        label: Issue number
        type: number

      - name: pages
        label: Pages
        type: string

      - name: bookname
        label: Book or volume title
        type: string

      - name: publisher
        label: Publisher
        type: string

      - name: file
        label: Publication PDF
        type: file
        description: Upload or select a PDF. Uploaded files are stored in this repository and served by the website.
        options:
          media: publication_pdfs
          extensions: [pdf]
          rename: safe

      - name: publisherlink
        label: Publisher or DOI link
        type: string
        description: Full https:// URL.

      - name: preprintlink
        label: Preprint link
        type: string
        description: Full https:// URL, such as an arXiv page.

      - name: code
        label: Code link
        type: string
        description: Full https:// URL for a code repository.

      - name: website
        label: Project website
        type: string
        description: Full https:// URL for a related project page.

      - name: additionaldata
        label: Additional notes
        type: string
        list: true

      - name: tags
        label: Topic tags
        type: select
        options:
          multiple: true
          values:
            - Logic
            - Game Theory
            - Social Choice Theory

      - name: abstract
        label: Abstract
        type: text

      - name: blurb
        label: General blurb
        type: text

      - name: front_page
        label: Featured on front page
        type: boolean
        default: false

      - name: frontpage_data
        label: Homepage display settings
        type: object
        list:
          max: 1
          collapsible:
            collapsed: false
            summary: "{short_blurb}"
        fields:
          - name: icon
            label: Link icon
            type: select
            options:
              values:
                - name: link
                  label: Link
                - name: pdf
                  label: PDF
                - name: none
                  label: None

          - name: short_blurb
            label: Homepage citation
            type: text
            description: Short citation displayed after the title on the homepage.

          - name: use_publisher_link
            label: Link title to publisher or DOI
            type: boolean
            default: false

          - name: use_preprint_link
            label: Link title to preprint
            type: boolean
            default: false

  - name: courses
    label: Teaching courses
    description: Create and update regular UMD teaching courses. ESSLLI and other short courses are not included.
    type: collection
    path: data/courses
    subfolders: false
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    operations:
      create: true
      rename: false
      delete: false
    view:
      layout: list
      primary: title
      fields: [title, course_number, current_semester, level]
      sort: [title, course_number, current_semester, level]
      search: [title, short_name, course_number, current_semester, level]
      default:
        search: ""
        sort: title
        order: asc
    fields:
      - name: title
        label: Course title
        type: string
        required: true

      - name: short_name
        label: Short title
        type: string
        description: Shorter title used where space is limited. It may be the same as the course title.

      - name: course_number
        label: Course number
        type: string
        description: For example, PHIL 121 or PHPE 408O/PHIL 438V.

      - name: level
        label: Level
        type: select
        required: true
        options:
          values:
            - Undergraduate
            - Graduate
            - Undergraduate/Graduate

      - name: current_semester
        label: Current or most recent semester
        type: string
        description: Use a value such as Fall 2026 or Spring 2027. This controls whether the course appears under Current Courses.

      - name: website
        label: Course websites
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{sem}"
        description: Put the current semester first; the website uses the first entry for the main course button.
        fields:
          - name: sem
            label: Semester
            type: string
            required: true

          - name: www
            label: Website URL
            type: string
            description: Full http:// or https:// URL.

          - name: link
            label: Legacy website URL
            type: string
            description: Preserved for older course data. Use Website URL for new entries.

      - name: syllabus
        label: Syllabi
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{sem}"
        description: Put the current semester first; the website uses the first entry for the syllabus button.
        fields:
          - name: sem
            label: Semester
            type: string
            required: true

          - name: file
            label: Syllabus PDF
            type: file
            options:
              media: course_syllabi
              extensions: [pdf]
              rename: safe

      - name: past_semesters
        label: Past semesters
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{sem}"
        fields:
          - name: sem
            label: Semester
            type: string
            required: true

          - name: www
            label: Website URL
            type: string
            description: Full http:// or https:// URL. This may be left blank.

      - name: comment
        label: Additional note
        type: text

      - name: body
        label: Course description
        type: rich-text
        options:
          format: markdown
          switcher: true
          media: false

  - name: homepage_announcements
    label: Homepage announcements
    description: Add, reorder, show, and hide announcements displayed on the homepage.
    type: file
    path: data/announcements.yaml
    format: yaml
    list: true
    operations:
      delete: false
    fields:
      - name: text
        label: Announcement
        type: text
        required: true
        description: Markdown links such as [Conference](https://example.org) are supported.

      - name: type
        label: Type
        type: select
        default: general
        options:
          values:
            - name: general
              label: General or other
            - name: talk
              label: Talk
            - name: conference
              label: Conference
            - name: workshop
              label: Workshop
            - name: course
              label: Course

      - name: posted
        label: Posted date
        type: date
        default: ""
        description: Optional. Displays the NEW badge for 30 days.
        options:
          time: false
          format: yyyy-MM-dd

      - name: new_until
        label: Show NEW badge until
        type: date
        default: ""
        description: Optional override for the normal 30-day NEW period. Requires a posted date.
        options:
          time: false
          format: yyyy-MM-dd

      - name: show
        label: Show on homepage
        type: boolean
        default: true
